[package]
name = "speedrun_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
azalea = { path = "../azalea/azalea" }
tokio = { version = "1", features = ["full"] }
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
