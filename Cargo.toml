[package]
name = "speedrun_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
azalea = { path = "../azalea/azalea" }
tokio = { version = "1", features = ["full"] }
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
# The item knowledge base (src/knowledge.rs) reads data/knowledge.json.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
